<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Haunt · East Lakeview</title>
<meta name="description" content="Vote for your favorite Halloween house in East Lakeview.">
<!-- Filled in per page by the Worker so shared links get a real preview. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="The Haunt">
<meta property="og:title" content="The Haunt · East Lakeview">
<meta property="og:description" content="Vote for your favorite Halloween house in East Lakeview.">
<meta property="og:url" content="">
<meta property="og:image" content="">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0E0A14">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎃</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--night:#0E0A14;--panel:#1B1424;--edge:#2C2136;--porch:#FF8A3D;--glow:#FFD08A;--bone:#EDE6DA;--dim:#9A8DA8;--moss:#7FA388}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--night);color:var(--bone);font:16px/1.45 "DM Sans",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
.disp{font-family:"Fraunces",Georgia,serif;font-weight:800;letter-spacing:-.02em;line-height:1.02}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* ---- header ---- */
header{padding:calc(env(safe-area-inset-top) + 28px) 0 22px}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
h1{font-size:clamp(44px,12vw,76px);margin:0}
h1 b{color:var(--porch);font-weight:800}
.lede{margin:14px 0 0;color:var(--bone);opacity:.86;max-width:34em}
.status{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--edge);font-size:14px}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--moss);box-shadow:0 0 0 4px rgba(127,163,136,.18)}
.pill.closed .dot{background:var(--porch);box-shadow:0 0 0 4px rgba(255,138,61,.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;
  border:1px solid var(--edge);background:var(--panel);transition:transform .12s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--porch);border-color:var(--porch);color:#1B0E04}
.btn.picked{background:transparent;border-color:var(--moss);color:var(--moss)}

/* ---- winner ---- */
.winner{margin:6px 0 26px;border-radius:22px;overflow:hidden;background:var(--panel);border:1px solid var(--edge);display:grid}
.winner img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#140f1b}
.winner .body{padding:18px 20px 20px}
.winner .tag{color:var(--glow);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.winner h2{font-size:clamp(30px,8vw,44px);margin:6px 0 4px}
.winner p{margin:0;color:var(--dim)}
@media(min-width:760px){.winner{grid-template-columns:1.3fr 1fr}.winner img{aspect-ratio:auto;height:100%;min-height:300px}.winner .body{align-self:center;padding:28px}}

/* ---- gallery ---- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-bottom:calc(env(safe-area-inset-bottom) + 48px)}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{position:relative;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;text-align:left;border-radius:16px;overflow:hidden;background:var(--panel);border:1px solid var(--edge);transition:transform .15s}
.card:active{transform:scale(.98)}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#140f1b}
.card .meta{padding:10px 12px 12px}
.card .name{font-weight:700;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .loc{font-size:13px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.mine{border-color:var(--moss)}
.badge{position:absolute;top:10px;left:10px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;
  background:rgba(14,10,20,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.badge.mine{color:var(--moss)}
.badge.count{left:auto;right:10px;color:var(--glow)}
.empty{padding:60px 0 90px;text-align:center;color:var(--dim)}
.empty .disp{font-size:28px;color:var(--bone);margin-bottom:8px}

/* ---- detail ---- */
.sheet{position:fixed;inset:0;z-index:20;background:var(--night);overflow-y:auto;display:none;overscroll-behavior:contain}
.sheet.on{display:block;animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sheet .bar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;
  background:linear-gradient(180deg,rgba(14,10,20,.92),rgba(14,10,20,0))}
.round{width:42px;height:42px;border-radius:50%;background:rgba(27,20,36,.9);border:1px solid var(--edge);display:inline-flex;align-items:center;justify-content:center;font-size:20px}
.photos{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-top:-66px}
.photos::-webkit-scrollbar{display:none}
.photos img{flex:0 0 100%;width:100%;max-height:72vh;object-fit:cover;scroll-snap-align:center;background:#140f1b}
.dots{display:flex;justify-content:center;gap:6px;padding:12px 0 0;min-height:20px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--edge)}
.dots i.on{background:var(--bone)}
.detail{max-width:640px;margin:0 auto;padding:14px 20px calc(env(safe-area-inset-bottom) + 36px)}
.detail h2{font-size:clamp(32px,9vw,46px);margin:0}
.detail .loc{margin:8px 0 0;color:var(--dim);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.detail .loc a{color:var(--glow);text-decoration:none;font-weight:500}
.actions{display:flex;gap:10px;margin-top:22px}
.actions .btn{padding:14px 18px;font-size:16px}
.actions .grow{flex:1}
.note{margin:14px 0 0;font-size:14px;color:var(--dim)}
.result{margin-top:22px;padding:16px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--edge)}
.result b{font-family:"Fraunces",Georgia,serif;font-size:28px;color:var(--glow)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:40;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  padding:11px 18px;border-radius:999px;background:var(--bone);color:var(--night);font-weight:700;font-size:14px;transition:.2s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">East Lakeview · Halloween 2026</p>
    <h1 class="disp">The <b>Haunt</b></h1>
    <p class="lede" id="lede">Our neighbors went all out. Look through the houses and pick your favorite. The winner gets a lawn sign to show it off.</p>
    <div class="status">
      <span class="pill" id="status"><span class="dot"></span><span id="statusText">Loading…</span></span>
      <button class="btn" id="shareAll">Share</button>
    </div>
  </header>
  <div id="winner"></div>
  <main class="grid" id="grid"></main>
</div>

<section class="sheet" id="sheet" aria-modal="true" role="dialog">
  <div class="bar">
    <button class="round" id="back" aria-label="Back">←</button>
    <button class="round" id="shareOne" aria-label="Share this house">↗</button>
  </div>
  <div class="photos" id="photos"></div>
  <div class="dots" id="dots"></div>
  <div class="detail">
    <h2 class="disp" id="dName"></h2>
    <p class="loc" id="dLoc"></p>
    <div id="dAction"></div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let board={houses:[],endsAt:0,closed:false,myVote:null,counts:null};
let openId=null;

/* ---- one anonymous id per browser ---- */
function voterId(){
  let v=null;try{v=localStorage.getItem('haunt:voter')}catch(e){}
  if(!v){v=crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now();try{localStorage.setItem('haunt:voter',v)}catch(e){}}
  return v;
}
async function api(path,body){
  const res=await fetch('/api/'+path,{method:body?'POST':'GET',
    headers:{'content-type':'application/json','x-voter':voterId()},body:body?JSON.stringify(body):undefined});
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||'Something went wrong.');
  return data;
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2400)}

const photo=(id,small)=>id?`/p/${id}${small?'/t':''}`:'';
const houseById=id=>board.houses.find(h=>h.id===id);
const countOf=id=>(board.counts&&board.counts[id])||0;
const directions=loc=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(loc+', Chicago, IL');

/* ---- status line ---- */
function renderStatus(){
  const end=new Date(board.endsAt);
  const when=end.toLocaleString([],{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'America/Chicago'});
  $('#status').classList.toggle('closed',board.closed);
  if(board.closed){$('#statusText').textContent='Voting is closed';return}
  const days=Math.ceil((board.endsAt-Date.now())/864e5);
  $('#statusText').textContent=`Voting closes ${when}`+(days>1?` · ${days} days left`:days===1?' · last day':'');
}

/* ---- winner, once voting closes ---- */
function leaders(){
  if(!board.closed||!board.counts)return[];
  const top=Math.max(0,...board.houses.map(h=>countOf(h.id)));
  return top?board.houses.filter(h=>countOf(h.id)===top):[];
}
function renderWinner(){
  const w=leaders();
  if(!board.closed){$('#winner').innerHTML='';return}
  $('#lede').textContent=w.length?'Thanks for voting, neighbors. Here’s who took it.':'Voting is closed.';
  if(!w.length){$('#winner').innerHTML='';return}
  const h=w[0],tie=w.length>1,n=countOf(h.id);
  $('#winner').innerHTML=`<button class="winner" data-open="${esc(h.id)}" style="width:100%;text-align:left">
    <img src="${photo(h.photos[0])}" alt="">
    <div class="body"><div class="tag">${tie?'Tied for first':'Winner'}</div>
      <h2 class="disp">${tie?w.map(x=>esc(x.name)).join(' & '):esc(h.name)}</h2>
      <p>${n} vote${n===1?'':'s'}${tie?' each':''}</p></div></button>`;
}

/* ---- gallery ---- */
function renderGrid(){
  const list=board.closed&&board.counts
    ?board.houses.slice().sort((a,b)=>countOf(b.id)-countOf(a.id)||a.created-b.created)
    :board.houses;
  if(!list.length){
    $('#grid').innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="disp">The houses are on their way.</div>Check back soon.</div>`;
    return;
  }
  $('#grid').innerHTML=list.map(h=>{
    const mine=board.myVote===h.id,n=countOf(h.id);
    return `<button class="card${mine?' mine':''}" data-open="${esc(h.id)}">
      <img src="${photo(h.photos[0],true)}" alt="${esc(h.name)}" loading="lazy">
      ${mine?'<span class="badge mine">★ Your pick</span>':''}
      ${board.closed?`<span class="badge count">${n} vote${n===1?'':'s'}</span>`:''}
      <div class="meta"><div class="name">${esc(h.name)}</div>${h.location?`<div class="loc">${esc(h.location)}</div>`:''}</div>
    </button>`}).join('');
}
function render(){renderStatus();renderWinner();renderGrid();if(openId)renderDetail()}

document.addEventListener('click',e=>{
  const c=e.target.closest('[data-open]');
  if(c)openHouse(c.dataset.open,true);
});

/* ---- detail ---- */
function openHouse(id,push){
  if(!houseById(id))return;
  openId=id;
  if(push)history.pushState({id},'','/h/'+id);
  renderDetail();
  const s=$('#sheet');s.classList.add('on');s.scrollTop=0;$('#photos').scrollLeft=0;
  document.body.style.overflow='hidden';
}
function closeHouse(fromPop){
  openId=null;$('#sheet').classList.remove('on');document.body.style.overflow='';
  if(!fromPop)history.pushState({},'','/');
}
function renderDetail(){
  const h=houseById(openId);if(!h)return closeHouse();
  const ph=$('#photos');
  if(ph.dataset.for!==h.id+h.photos.join()){
    ph.dataset.for=h.id+h.photos.join();
    ph.innerHTML=h.photos.map(p=>`<img src="${photo(p)}" alt="${esc(h.name)}">`).join('');
    $('#dots').innerHTML=h.photos.length>1?h.photos.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join(''):'';
  }
  $('#dName').textContent=h.name;
  $('#dLoc').innerHTML=h.location?`<span>${esc(h.location)}</span><a href="${directions(h.location)}" target="_blank" rel="noopener">Directions ↗</a>`:'';

  const mine=board.myVote===h.id,n=countOf(h.id);
  if(board.closed){
    const won=leaders().some(x=>x.id===h.id);
    $('#dAction').innerHTML=`<div class="result"><b>${n}</b> vote${n===1?'':'s'}${won?' · <span style="color:var(--glow)">Winner</span>':''}
      ${mine?'<div class="note" style="margin-top:6px">This was your pick.</div>':''}</div>`;
    return;
  }
  const other=board.myVote&&!mine&&houseById(board.myVote);
  $('#dAction').innerHTML=`<div class="actions">
      <button class="btn grow ${mine?'picked':'primary'}" id="voteBtn">${mine?'★ Your pick':'Make this my pick'}</button></div>
    <p class="note">${mine?'Tap again to take your vote back. You can change your pick until voting closes.'
      :other?`Your current pick is <b>${esc(other.name)}</b>. Choosing this one moves your vote here.`
      :'One pick per phone. You can change it until voting closes.'}</p>`;
  $('#voteBtn').onclick=()=>vote(mine?null:h.id);
}
$('#photos').addEventListener('scroll',()=>{
  const p=$('#photos'),i=Math.round(p.scrollLeft/Math.max(p.clientWidth,1));
  $('#dots').querySelectorAll('i').forEach((d,j)=>d.classList.toggle('on',i===j));
},{passive:true});
$('#back').onclick=()=>closeHouse(false);
window.addEventListener('popstate',()=>{
  const m=/^\/h\/([a-z0-9]+)/.exec(location.pathname);
  if(m&&houseById(m[1]))openHouse(m[1],false);else if(openId)closeHouse(true);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openId)closeHouse(false)});

/* ---- voting ---- */
async function vote(id){
  const btn=$('#voteBtn');if(btn)btn.disabled=true;
  try{
    const r=await api('vote',{houseId:id});
    board.myVote=r.myVote;render();
    toast(id?'Vote saved':'Vote taken back');
  }catch(err){
    toast(err.message);
    if(/closed/i.test(err.message))load();
  }finally{const b=$('#voteBtn');if(b)b.disabled=false}
}

/* ---- sharing ---- */
async function share(url,title){
  if(navigator.share){try{await navigator.share({title,url});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(url);toast('Link copied')}
  catch(e){prompt('Copy this link:',url)}
}
$('#shareAll').onclick=()=>share(location.origin+'/','The Haunt · East Lakeview');
$('#shareOne').onclick=()=>{const h=houseById(openId);if(h)share(location.origin+'/h/'+h.id,h.name+' · The Haunt')};

/* ---- load ---- */
async function load(){
  try{board=await api('board')}
  catch(e){$('#statusText').textContent='Couldn’t load the houses. Try refreshing.';return}
  render();
}
(async()=>{
  await load();
  const m=/^\/h\/([a-z0-9]+)/.exec(location.pathname);
  if(m){if(houseById(m[1]))openHouse(m[1],false);else history.replaceState({},'','/')}
  // Catch the moment voting closes if the page is left open.
  setInterval(()=>{if(!board.closed&&Date.now()>board.endsAt)load();else renderStatus()},60000);
})();
</script>
</body>
</html>
